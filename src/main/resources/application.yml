server:
  port: 8080

spring:
  application:
    name: polizas-api
  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# Porcentaje de IPC aplicado por defecto en las renovaciones (puede sobreescribirse por request)
negocio:
  ipc-porcentaje: 5.0

# Seguridad minima exigida por el enunciado: header x-api-key
security:
  api-key: 123456

logging:
  level:
    com.pruebatecnica.polizas: INFO
